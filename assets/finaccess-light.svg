<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="FinAccess Kenya 2024 Weighted Survey Model Summary">
  <rect x="0.5" y="0.5" width="639" height="359" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <text x="28" y="37" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700">FinAccess Kenya 2024 · Weighted Topline</text>
  <rect x="444" y="20" width="168" height="24" rx="12" fill="#f8fafc" stroke="#d0d7de" stroke-width="1"/>
  <text x="528" y="36" text-anchor="middle" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600">CBK · KNBS · FSD KENYA</text>
  <line x1="28" y1="56" x2="612" y2="56" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Bar 1: Formal Access -->
  <text x="28" y="85" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Formal Financial Access</text>
  <text x="612" y="85" text-anchor="end" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="600">84.8% weighted (85.7% unweighted)</text>
  <rect x="28" y="95" width="584" height="12" rx="6" fill="#e2e8f0"/>
  <rect x="28" y="95" width="495" height="12" rx="6" fill="#059669"/>

  <!-- Bar 2: Informal Only -->
  <text x="28" y="139" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Informal Only</text>
  <text x="612" y="139" text-anchor="end" fill="#0284c7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="600">5.2% weighted</text>
  <rect x="28" y="149" width="584" height="12" rx="6" fill="#e2e8f0"/>
  <rect x="28" y="149" width="32" height="12" rx="6" fill="#0284c7"/>

  <!-- Bar 3: Excluded -->
  <text x="28" y="193" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Excluded</text>
  <text x="612" y="193" text-anchor="end" fill="#d97706" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="600">9.9% weighted</text>
  <rect x="28" y="203" width="584" height="12" rx="6" fill="#e2e8f0"/>
  <rect x="28" y="203" width="58" height="12" rx="6" fill="#d97706"/>

  <!-- Inset Metric Boxes -->
  <rect x="28.5" y="236.5" width="183" height="74" rx="8" fill="#f8fafc" stroke="#d0d7de" stroke-width="1"/>
  <text x="44" y="266" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700">290 MB -&gt; 8 MB</text>
  <text x="44" y="290" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">Streaming Python ETL</text>

  <rect x="228.5" y="236.5" width="183" height="74" rx="8" fill="#f8fafc" stroke="#d0d7de" stroke-width="1"/>
  <text x="244" y="266" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700">48.5% to 94.0%</text>
  <text x="244" y="290" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">45-pt county spread</text>

  <rect x="428.5" y="236.5" width="183" height="74" rx="8" fill="#f8fafc" stroke="#d0d7de" stroke-width="1"/>
  <text x="444" y="266" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700">63% vs 5%</text>
  <text x="444" y="290" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">Excluded (No ID vs ID)</text>

  <text x="28" y="338" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">19,750 adult respondents representing 28.1M Kenyan adults · 5-page Power BI model</text>
</svg>
